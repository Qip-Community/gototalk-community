<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление на новости...</title>
    <!-- Автоматический редирект через 0 секунд -->
    <meta http-equiv="refresh" content="0; url=https://gototalk.ct.ws/">
    <script>
        // Мгновенный редирект на страницу новостей основного сайта
        window.location.href = "https://gototalk.ct.ws/";
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container { text-align: center; }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>Перенаправляем вас на страницу новостей...</p>
        <p>Если этого не произошло, <a href="https://gototalk.meganarod.ru/news.html" style="color: #818cf8;">нажмите сюда</a>.</p>
    </div>
</body>
</html>
