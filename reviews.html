<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoToTalk — Гостевая книга</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>
<body>
    <header>
        <div class="container header-flex">
            <div class="logo">📡 GoToTalk <span>Community</span></div>
            <button class="menu-toggle" id="menu-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
            <nav>
                <a href="index.html" data-i18n="nav-home">Главная</a>
                <a href="download.html" data-i18n="nav-download">Скачать</a>
                <a href="about.html" data-i18n="nav-about">О нас</a>
                <a href="team.html" data-i18n="nav-team">Команда</a>
                <a href="guide.html" data-i18n="nav-guide">Инструкция</a>
                <a href="news.html" data-i18n="nav-news">Новости</a>
                <a href="reviews.html" class="active" data-i18n="nav-guestbook">Гостевая</a>
                <a href="faq.html" data-i18n="nav-faq">FAQ</a>
                <a href="blog.html" data-i18n="nav-blog">Блог</a>
                <a href="links.html" data-i18n="nav-links">Ссылки</a>
                <a href="privacy.html" data-i18n="nav-privacy">Конфиденциальность</a>
                <a href="https://discord.gg/VSJpGajNmP" target="_blank" data-i18n="nav-discord">Discord</a>
                <button id="lang-toggle" class="lang-toggle">RU / EN</button>
                <button id="theme-toggle" class="theme-toggle">🌙 Тема</button>
            </nav>
        </div>
    </header>
    <main>
        <section class="reviews-page">
            <div class="container">
                <h1 data-i18n="guestbook-title">📖 Гостевая книга</h1>
                <p class="subtitle" data-i18n="guestbook-subtitle">Оставь свой след в истории</p>
                <div class="review-form">
                    <h2 data-i18n="guestbook-form-title">✏️ Написать сообщение</h2>
                    <form id="reviewForm">
                        <input type="text" id="reviewName" placeholder="Ваше имя или ник" required />
                        <textarea id="reviewText" rows="4" placeholder="Ваше сообщение..." required></textarea>
                        <button type="submit" class="btn" data-i18n="guestbook-form-btn">Отправить</button>
                    </form>
                </div>
                <div id="reviewsList">
                    <p class="placeholder" data-i18n="guestbook-loading">Загружаем сообщения...</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p data-i18n="footer-text">GoToTalk Community © 2026 — неофициальный фанатский проект.</p>
            <div class="socials"><a href="https://discord.gg/VSJpGajNmP" target="_blank">Discord</a><a href="#">YouTube</a><a href="#">TikTok</a></div>
        </div>
    </footer>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyXu_a7f3glcHChsXhxP83PN4w1qhC7YMPdwGjwGIs8TUyc-dnvcngob6gab1RrYDOLvg/exec";
        async function loadMessages() {
            const container = document.getElementById("reviewsList");
            try {
                const res = await fetch(`${API_URL}?action=get`);
                const data = await res.json();
                if (data.success && data.data && data.data.length > 0) {
                    container.innerHTML = data.data.map(msg => `
                        <div class="review-item">
                            <div class="review-header"><strong>${escapeHtml(msg[1] || "Аноним")}</strong><span class="review-date">${escapeHtml(msg[0] || "")}</span></div>
                            <p>${escapeHtml(msg[2] || "")}</p>
                        </div>
                    `).join("");
                } else {
                    container.innerHTML = '<p class="placeholder">Пока нет сообщений.</p>';
                }
            } catch (e) { container.innerHTML = '<p class="placeholder">❌ Ошибка загрузки.</p>'; }
        }
        document.getElementById("reviewForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const name = document.getElementById("reviewName").value.trim();
            const text = document.getElementById("reviewText").value.trim();
            if (!name || !text) { alert("Заполните все поля!"); return; }
            const btn = this.querySelector(".btn");
            btn.textContent = "Отправка..."; btn.disabled = true;
            try {
                const url = `${API_URL}?action=add&name=${encodeURIComponent(name)}&message=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.success) {
                    document.getElementById("reviewName").value = ""; document.getElementById("reviewText").value = "";
                    loadMessages(); alert("✅ Спасибо!");
                } else { alert("❌ Ошибка."); }
            } catch (e) { alert("❌ Ошибка отправки."); }
            finally { btn.textContent = "Отправить"; btn.disabled = false; }
        });
        function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }
        document.addEventListener("DOMContentLoaded", loadMessages);
        (function() {
            const translations = {
                ru: { 'nav-home': 'Главная', 'nav-download': 'Скачать', 'nav-about': 'О нас', 'nav-team': 'Команда', 'nav-guide': 'Инструкция', 'nav-news': 'Новости', 'nav-guestbook': 'Гостевая', 'nav-faq': 'FAQ', 'nav-blog': 'Блог', 'nav-links': 'Ссылки', 'nav-privacy': 'Конфиденциальность', 'nav-discord': 'Discord', 'guestbook-title': '📖 Гостевая книга', 'guestbook-subtitle': 'Оставь свой след', 'guestbook-form-title': '✏️ Написать сообщение', 'guestbook-form-btn': 'Отправить', 'guestbook-loading': 'Загружаем сообщения...', 'footer-text': 'GoToTalk Community © 2026 — неофициальный фанатский проект.' },
                en: { 'nav-home': 'Home', 'nav-download': 'Download', 'nav-about': 'About', 'nav-team': 'Team', 'nav-guide': 'Guide', 'nav-news': 'News', 'nav-guestbook': 'Guestbook', 'nav-faq': 'FAQ', 'nav-blog': 'Blog', 'nav-links': 'Links', 'nav-privacy': 'Privacy', 'nav-discord': 'Discord', 'guestbook-title': '📖 Guestbook', 'guestbook-subtitle': 'Leave your mark', 'guestbook-form-title': '✏️ Write a message', 'guestbook-form-btn': 'Send', 'guestbook-loading': 'Loading...', 'footer-text': 'GoToTalk Community © 2026 — unofficial fan project.' }
            };
            let currentLang = localStorage.getItem('qip-lang') || 'ru';
            function setLanguage(lang) {
                currentLang = lang; localStorage.setItem('qip-lang', lang);
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
                });
                document.documentElement.lang = lang;
            }
            function toggleLang() { setLanguage(currentLang === 'ru' ? 'en' : 'ru'); }
            (function initTheme() {
                const themeToggle = document.getElementById('theme-toggle');
                if (!themeToggle) return;
                const savedTheme = localStorage.getItem('qip-theme');
                if (savedTheme === 'dark') { document.body.classList.add('dark-theme'); themeToggle.textContent = '☀️ Светлая'; }
                themeToggle.addEventListener('click', function() {
                    const isDark = document.body.classList.toggle('dark-theme');
                    localStorage.setItem('qip-theme', isDark ? 'dark' : 'light');
                    themeToggle.textContent = isDark ? '☀️ Светлая' : '🌙 Тёмная';
                });
            })();
            document.addEventListener('DOMContentLoaded', function() {
                setLanguage(currentLang);
                const langBtn = document.getElementById('lang-toggle');
                if (langBtn) langBtn.addEventListener('click', toggleLang);
            });
        })();
    </script>
    <script>
    (function() {
        const toggle = document.getElementById('menu-toggle');
        const nav = toggle && toggle.nextElementSibling;
        if (toggle && nav) {
            toggle.addEventListener('click', function() {
                nav.classList.toggle('nav-open'); toggle.classList.toggle('active');
            });
            nav.querySelectorAll('a').forEach(function(link) {
                link.addEventListener('click', function() {
                    nav.classList.remove('nav-open'); toggle.classList.remove('active');
                });
            });
        }
    })();
    </script>
    <script src="easter-egg.js"></script>
</body>
</html>
