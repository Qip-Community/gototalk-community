<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoToTalk — Переезд сайта</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            animation: popIn 0.4s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 {
            color: #fbbf24;
            margin-bottom: 15px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #94a3b8;
        }
        .btn {
            display: inline-block;
            background: #6366f1;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="modal-overlay">
        <div class="modal-box">
            <h1>⚠️ Важное объявление</h1>
            <p>
                <strong>21 ноября 2026 года</strong> мы прекращаем поддержку сайта на GitHub Pages. <br><br>
                Страницы сайта (новости, инструкции, блог) переезжают на новый сервер. <br>
                <strong>GitHub останется только как хранилище для скачивания файлов.</strong>
            </p>
            <button class="btn" onclick="window.location.href='https://gototalk.meganarod.ru/'">Перейти на основной сайт →</button>
        </div>
    </div>

    <!-- Скрипт на случай, если пользователь закроет окно (или для автоматического редиректа через 10 секунд) -->
    <script>
        setTimeout(function() {
            window.location.href = "https://gototalk.meganarod.ru/";
        }, 10000); // 10 секунд
    </script>

</body>
</html>
